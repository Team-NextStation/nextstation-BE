services:
  app:
    # 기본값은 현재 운영 동작과 같다. dev 스택만 .env로 값을 덮어써 8081/:dev로 뜬다.
    image: ${DOCKER_USERNAME}/nextstation-be:${IMAGE_TAG:-prod}
    ports:
      - "${APP_PORT:-8080}:8080"
    # 0은 제한 없음. dev에만 한도를 걸어 dev의 메모리 폭주가 호스트 전체 OOM으로 번지지 않게 한다.
    mem_limit: ${MEM_LIMIT:-0}
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # JDK 10+ JVM은 cgroup 한도의 1/4을 최대 힙으로 잡는다.
      # mem_limit을 거는 환경에서는 힙이 현재 커밋(151MB)을 밑돌지 않도록 -Xmx를 함께 지정한다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      
      JWT_SECRET: ${JWT_SECRET}
      
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      KAKAO_OAUTH_REDIRECT_URIS: ${KAKAO_OAUTH_REDIRECT_URIS}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}

      APPLE_OAUTH_ALLOWED_AUDIENCES: ${APPLE_OAUTH_ALLOWED_AUDIENCES}

      DISCORD_ERROR_WEBHOOK_URL: ${DISCORD_ERROR_WEBHOOK_URL}
      DISCORD_REPORT_WEBHOOK_URL: ${DISCORD_REPORT_WEBHOOK_URL}
      REPORT_CRON_DAILY: ${REPORT_CRON_DAILY:-0 0 9 * * *}
      REPORT_CRON_WEEKLY: ${REPORT_CRON_WEEKLY:-0 10 9 * * MON}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  redis-data:
