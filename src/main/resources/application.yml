spring:
  application:
    name: nextstation
  profiles:
    active: local
  jpa:
    hibernate:
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # SMTP 서버 응답 지연 시 요청 스레드가 무한 대기하지 않도록 타임아웃 지정
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 180000 # 이메일 인증번호 유효시간, 3분

member:
  profile-image:
    # S3 외에 프로필 이미지로 허용할 외부 CDN 도메인 (소셜 로그인이 내려주는 이미지)
    # 서브도메인이 계정마다 달라 접미사로 판정하므로 반드시 점으로 시작하는 도메인을 적는다.
    # 재배포 없이 추가할 수 있도록 상수가 아닌 설정값으로 둔다.
    allowed-host-suffixes: .kakaocdn.net

logging:
  level:
    root: INFO
    com.cotato.nextstation: DEBUG

server:
  port: 8080
  # nginx가 https를 받아 앱에는 http로 넘기므로, 앱이 스스로를 http로 인식한다.
  # X-Forwarded-Proto를 반영해야 자기 주소를 https로 만든다.
  # Swagger UI가 서버 주소를 자동으로 채울 때 이 값을 쓴다.
  forward-headers-strategy: framework