spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nextstation-local}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    # localhost는 HTTPS가 아니라서 secure 쿠키는 브라우저가 저장을 거부한다 -> 로컬에서만 완화
    secure: false
    same-site: Lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
    redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS}

apple:
  oauth:
    allowed-audiences: ${APPLE_OAUTH_ALLOWED_AUDIENCES:}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}