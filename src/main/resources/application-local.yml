spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nextstation-local}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    # localhost는 HTTPS가 아니라서 secure 쿠키는 브라우저가 저장을 거부한다 -> 로컬에서만 완화
    secure: false
    same-site: Lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  admin-key: ${KAKAO_ADMIN_KEY:}
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
    redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS}

apple:
  oauth:
    allowed-audiences: ${APPLE_OAUTH_ALLOWED_AUDIENCES:}
    # 웹(Services ID) 로그인 전용 - 네이티브(Bundle ID)와 다른 client_id를 쓴다.
    # allowed-audiences에도 이 값을 추가해둬야 id_token의 aud 검증을 통과한다.
    web-client-id: ${APPLE_OAUTH_WEB_CLIENT_ID:}
    # Apple Developer 콘솔의 Services ID에 등록한 Return URL과 정확히 일치해야 한다.
    web-redirect-uri: ${APPLE_OAUTH_WEB_REDIRECT_URI:}
    # 콜백 처리 후 최종적으로 사용자를 돌려보낼 프론트엔드 주소
    web-frontend-redirect-uri: ${APPLE_OAUTH_WEB_FRONTEND_REDIRECT_URI:}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}