spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  cloud:
    aws:
      region:
        static: ${AWS_REGION}

logging:
  level:
    com.cotato.nextstation: INFO
    org.hibernate.SQL: warn
  discord-error:
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL}

report:
  discord:
    webhook-url: ${DISCORD_REPORT_WEBHOOK_URL}

jwt:
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    secure: true
    same-site: None

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}
  rest-api-key: ${KAKAO_REST_API_KEY}
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
    redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS}

apple:
  oauth:
    # 네이티브 앱의 Bundle ID(App ID). 나중에 웹 Services ID를 추가하면 여기에 콤마로 더한다.
    allowed-audiences: ${APPLE_OAUTH_ALLOWED_AUDIENCES}
    # revoke/refresh_token 교환용 client_secret(ES256 JWT) 서명에 쓴다 - Apple Account Holder가 발급
    team-id: ${APPLE_OAUTH_TEAM_ID}
    key-id: ${APPLE_OAUTH_KEY_ID}
    private-key: ${APPLE_OAUTH_PRIVATE_KEY}

security:
  oauth-credential:
    secret: ${OAUTH_CREDENTIAL_SECRET}
    salt: ${OAUTH_CREDENTIAL_SALT}