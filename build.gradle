plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.NextStation'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    //JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // security
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-crypto'

    // validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

    //webmvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // place 데이터 파이프라인 1회성 배치 스크립트용 CSV 파서
    implementation 'org.apache.commons:commons-csv:1.11.0'

    // place 데이터 파이프라인 배치 스크립트에서 구글 시트에 보강 결과를 직접 써넣기 위한 Sheets API
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20250603-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'

    // S3 presigned URL 발급
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.0'

    // 닉네임 금칙어(비속어) 필터링
    implementation 'io.github.vaneproject:badwordfiltering:1.0.0'

    // discord
    implementation 'com.github.napstr:logback-discord-appender:1.0.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

def dotenv = {
    def envFile = file('.env.local')
    if (!envFile.exists()) return [:]
    envFile.readLines()
            .findAll { !it.trim().startsWith('#') && it.contains('=') }
            .collectEntries {
                def i = it.indexOf('=')
                def key = it.substring(0, i).trim().replaceFirst(/^export\s+/, '')
                // 값을 감싼 따옴표를 벗긴다. 남겨두면 인증키에 그대로 섞여 들어가 인증 실패로만 드러난다.
                def value = it.substring(i + 1).trim().replaceAll(/^(["'])(.*)\1$/, '$2')
                [(key): value]
            }
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	environment dotenv()
}

tasks.register('placeGeocodingBatch', JavaExec) {
	group = 'application'
	description = '수집 장소 데이터를 카카오 API로 보강하는 1회성 배치 (KAKAO_REST_API_KEY, PLACE_SHEET_CSV_URL, PLACE_SPREADSHEET_ID 필요)'
	mainClass = 'com.cotato.nextstation.domain.place.batch.PlaceGeocodingBatch'
	classpath = sourceSets.main.runtimeClasspath
	environment dotenv()
}

tasks.register('placeImageFetchBatch', JavaExec) {
	group = 'application'
	description = 'TourAPI에서 장소 사진을 받아 place-photos/에 내려받는 1회성 배치 (TOUR_API_SERVICE_KEY 필요)'
	mainClass = 'com.cotato.nextstation.domain.place.batch.PlaceImageFetchBatch'
	classpath = sourceSets.main.runtimeClasspath
    environment dotenv()
}

tasks.register('placeVisitSeoulFetchBatch', JavaExec) {
	group = 'application'
	description = '비짓서울 사이트맵으로 장소 사진을 받아 place-photos/에 내려받는 1회성 배치'
	mainClass = 'com.cotato.nextstation.domain.place.batch.PlaceVisitSeoulFetchBatch'
	classpath = sourceSets.main.runtimeClasspath
	environment dotenv()
}

tasks.register('placeImageUploadBatch', JavaExec) {
	group = 'application'
	description = 'place-photos/{카카오 place id}/ 사진을 S3에 올리고 place-images.csv를 만드는 1회성 배치'
	mainClass = 'com.cotato.nextstation.domain.place.batch.PlaceImageUploadBatch'
	classpath = sourceSets.main.runtimeClasspath
    environment dotenv()
}

