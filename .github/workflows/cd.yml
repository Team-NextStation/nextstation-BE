# CD: main 또는 develop에 머지되면 이미지를 빌드해 Docker Hub에 올리고,
# EC2에 compose 파일을 복사한 뒤 최신 이미지로 컨테이너를 재배포한다.
# EC2 한 대에서 두 스택이 돌아가므로 브랜치에 따라 배포 디렉토리와 이미지 태그가 갈린다.
#   main    -> ~/app     (8080, :prod)
#   develop -> ~/app-dev (8081, :dev)
# 배포 후 헬스체크로 앱이 정상 기동됐는지 확인한다.
name: CD

on:
  push:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nextstation-be

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 0. 브랜치별 배포 대상 결정
      #    GitHub Environments를 쓰지 않는 이유: 환경 시크릿이 비면 에러 없이 레포 시크릿으로
      #    폴백하므로, dev 값을 빠뜨리면 dev 배포가 운영 컨테이너를 덮어쓴다. if/else는 빠뜨릴 수 없다.
      - name: Resolve deploy target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_DIR=/home/ec2-user/app"     >> $GITHUB_ENV
            echo "IMAGE_TAG=prod"                    >> $GITHUB_ENV
            echo "HEALTH_URL=${{ secrets.BACKEND_HEALTH_URL }}"     >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/home/ec2-user/app-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev"                     >> $GITHUB_ENV
            echo "HEALTH_URL=${{ secrets.BACKEND_HEALTH_URL_DEV }}" >> $GITHUB_ENV
          fi

      # 1. 저장소 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. JDK 17(Corretto) 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 캐싱 (의존성/래퍼 캐시로 빌드 속도 향상)
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      # 5. Gradle 빌드 (테스트 제외)
      - name: Build With Gradle
        run: ./gradlew build -x test

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6-1. buildx 빌더 준비 (기본 docker 드라이버는 --push 미지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. 이미지 빌드 후 Docker Hub에 push
      #    --platform linux/amd64: EC2(amd64)에서 확실히 돌도록 아키텍처 고정
      #    태그를 환경별로 가른다. 두 환경이 latest 하나를 공유하면 dev 빌드가 운영 태그를 덮어써 어느 이미지가 운영인지 알 수 없어진다.
      #    sha 태그는 롤백용으로 유지한다.
      - name: Build & Push image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --push .

      # 8. compose 파일을 EC2로 복사
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose-prod.yml"
          target: "${{ env.DEPLOY_DIR }}/"
          overwrite: true

      # 9. EC2에 SSH 접속해 재배포 + 헬스체크
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DEPLOY_DIR,HEALTH_URL
          script: |
            # 디렉토리가 없으면 잘못된 대상에 배포하는 것이므로 멈춘다
            cd "$DEPLOY_DIR" || exit 1

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # 최신 이미지 받아서 컨테이너 재시작
            # 각 디렉토리의 .env가 포트·태그·메모리 한도를 결정한다
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d
            docker image prune -f

            # 배포 후 헬스체크
            echo "Waiting for application health check..."
            if [ -z "$HEALTH_URL" ]; then
              echo "Health check URL is not set for this branch. Aborting."
              exit 1
            fi

            i=1
            while [ "$i" -le 30 ]; do
              # -o /dev/null: 헬스 응답 본문이 커서 로그를 덮지 않도록 버린다
              if curl -fsS -o /dev/null "$HEALTH_URL"; then
                echo "Application is healthy."
                exit 0
              fi
              echo "Health check attempt $i failed. Retrying in 10s..."
              i=$((i + 1))
              sleep 10
            done

            echo "Deployment health check failed. Recent logs:"
            docker compose -f docker-compose-prod.yml logs --tail=200
            exit 1